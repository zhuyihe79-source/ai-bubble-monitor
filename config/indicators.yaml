# direction: "high" = 数值越高越接近泡沫；"low" = 数值越低越接近泡沫
# max_stale_days: 数据超过这个天数没更新，评分时视为缺失
# publication_lag_days: 数据实际公布比所属日期晚多少天（财报一般在季末后 35 天内），避免历史评分用到“未来”信息
# score: false 表示只用于触发器和解读，不计入泡沫温度
# desc: 看板上解释这个维度在问什么
dimensions:
  valuation:   {label: 估值与集中度, weight: 1.0, desc: 钱是不是过度挤在 AI 龙头上（大盘集中度、半导体相对大盘、NVDA 偏离均线）}
  capex:       {label: 投入与回报, weight: 1.0, desc: 云厂商投入有多大、自己的现金流还撑不撑得住}
  leverage:    {label: 融资与杠杆, weight: 1.0, desc: 借钱是不是太容易（信用利差越窄，市场越松懈）}
  sentiment:   {label: 投机情绪, weight: 1.0, desc: 市场是不是太自满或太亢奋（“AI bubble”搜索热度、VIX）}
  demand:      {label: 真实需求, weight: 1.0, desc: 算力租金有没有下跌（供过于求的直接证据）}
  macro:       {label: 宏观与流动性, weight: 1.0, desc: 资金成本是否宽松（实际利率、期限利差）}

indicators:
  # ---- 估值与集中度（yfinance）----
  - id: spy_rsp_ratio
    name: 市值加权/等权标普500 (SPY/RSP)
    dimension: valuation
    source: yahoo
    params: {kind: ratio, num: SPY, den: RSP}
    direction: high
    frequency: daily
    max_stale_days: 10
  - id: smh_spy_ratio
    name: 半导体 ETF 相对标普500 (SMH/SPY)
    dimension: valuation
    source: yahoo
    params: {kind: ratio, num: SMH, den: SPY}
    direction: high
    frequency: daily
    max_stale_days: 10
  - id: nvda_ma200_gap
    name: NVDA 偏离 200 日均线
    dimension: valuation
    source: yahoo
    params: {kind: ma_gap, ticker: NVDA, window: 200}
    direction: high
    frequency: daily
    max_stale_days: 10

  # ---- 投入与回报（SEC EDGAR）----
  - id: hyperscaler_capex_ttm
    name: 五大云厂商 capex 滚动四季合计 (美元)
    dimension: capex
    source: edgar
    params: {metric: capex_ttm}
    direction: high
    frequency: quarterly
    max_stale_days: 200
    publication_lag_days: 35
  - id: hyperscaler_capex_to_ocf
    name: 五大云厂商 capex / 经营现金流
    dimension: capex
    source: edgar
    params: {metric: capex_to_ocf}
    direction: high
    frequency: quarterly
    max_stale_days: 200
    publication_lag_days: 35

  # ---- 融资与杠杆（FRED）----
  - id: hy_spread
    name: 美国高收益债利差 (OAS，FRED 只提供近 3 年)
    dimension: leverage
    source: fred
    params: {series: BAMLH0A0HYM2}
    direction: low        # 利差越窄，市场越松懈
    frequency: daily
    max_stale_days: 10
    # FRED 只给近 3 年，刚够最短窗口：分位只和 2023 年以来的窄利差比，且它一加入就让融资维度从 95 跳到 53。
    # 所以不计分，只用于 hy_widening 破裂信号；融资维度由长历史的 Baa 利差代表。
    score: false
  - id: baa_spread
    name: Moody's Baa 公司债收益率 - 10Y 国债（长历史）
    dimension: leverage
    source: fred
    params: {series: BAA10Y}
    direction: low
    frequency: daily
    max_stale_days: 10

  # ---- 投机情绪 ----
  - id: trends_ai_bubble
    name: Google Trends "AI bubble" 搜索热度
    dimension: sentiment
    source: trends
    params: {keyword: AI bubble}
    direction: high
    frequency: weekly
    max_stale_days: 21
  - id: vix
    name: VIX 波动率指数
    dimension: sentiment
    source: fred
    params: {series: VIXCLS}
    direction: low        # 波动率越低，越自满
    frequency: daily
    max_stale_days: 10

  # ---- 真实需求（手工录入）----
  - id: gpu_h100_rental
    name: H100 每小时租赁价 (美元)
    dimension: demand
    source: manual
    params: {file: gpu_h100_rental.csv}
    direction: low        # 租赁价下跌 = 供过于求
    frequency: weekly
    max_stale_days: 45

  # ---- 宏观与流动性（FRED）----
  - id: real_yield_10y
    name: 10 年期 TIPS 实际利率
    dimension: macro
    source: fred
    params: {series: DFII10}
    direction: low
    frequency: daily
    max_stale_days: 10
  - id: yield_curve_10y2y
    name: 10Y-2Y 国债利差
    dimension: macro
    source: fred
    params: {series: T10Y2Y}
    direction: low
    frequency: daily
    max_stale_days: 10

  # ---- 只用于触发器和解读，不计入泡沫温度（score: false）----
  - id: nvda_price
    name: NVDA 收盘价
    dimension: valuation
    source: yahoo
    params: {kind: price, ticker: NVDA}
    direction: high
    frequency: daily
    max_stale_days: 10
    score: false
  - id: smh_price
    name: SMH 半导体 ETF 收盘价
    dimension: valuation
    source: yahoo
    params: {kind: price, ticker: SMH}
    direction: high
    frequency: daily
    max_stale_days: 10
    score: false
  - id: spy_price
    name: SPY 标普500 ETF 收盘价
    dimension: valuation
    source: yahoo
    params: {kind: price, ticker: SPY}
    direction: high
    frequency: daily
    max_stale_days: 10
    score: false
  - id: hyperscaler_capex_q
    name: 五大云厂商单季 capex 合计 (美元)
    dimension: capex
    source: edgar
    params: {metric: capex_q}
    direction: high
    frequency: quarterly
    max_stale_days: 200
    publication_lag_days: 35
    score: false
  - id: nvda_revenue_q
    name: NVDA 单季收入 (美元，财季)
    dimension: capex
    source: edgar
    params: {metric: nvda_revenue_q}
    direction: high
    frequency: quarterly
    max_stale_days: 200
    publication_lag_days: 35
    score: false
  - id: hyperscaler_debt
    name: 五大云厂商有息负债合计 (美元，不含租赁)
    dimension: leverage
    source: edgar
    params: {metric: debt_total}
    direction: high
    frequency: quarterly
    max_stale_days: 200
    publication_lag_days: 35
    score: false

scoring:
  min_dimensions: 4   # 总分至少需要几个维度有数据，否则不发布

alerts:
  score_yellow: 60
  score_red: 80
  indicator_extreme_pct: 0.95

# 破裂触发器。transform:
#   level        当前值
#   pct_change   相对 days 天前的涨跌幅（就近取 tolerance_days 内的观测）
#   diff         相对 days 天前的差值
#   drawdown     相对过去 days 天最高点的回撤
# direction: above = 数值越高越危险；below = 越低越危险
# unit: pct（显示为百分比）、pp（百分点）、num（原值）
triggers:
  - id: capex_qoq
    name: 云厂商单季 capex 环比
    series: hyperscaler_capex_q
    transform: pct_change
    days: 91
    direction: below
    alert: 0.0
    trigger: -0.10
    unit: pct
    why: 资本开支第一次环比下降，意味着 AI 基建需求见顶，英伟达等供应链收入会直接受影响。
  - id: capex_yoy
    name: 云厂商 capex 同比（滚动四季）
    series: hyperscaler_capex_ttm
    transform: pct_change
    days: 365
    direction: below
    alert: 0.25
    trigger: 0.0
    unit: pct
    why: 当前估值隐含 capex 持续高增长；增速放缓本身就足以让供应链估值下修。
  - id: capex_vs_ocf
    name: 云厂商 capex / 经营现金流
    series: hyperscaler_capex_to_ocf
    transform: level
    direction: above
    alert: 0.9
    trigger: 1.0
    unit: num
    why: 超过 1 意味着投资已经花光经营现金流，需要靠借债或减少回购来支撑，财务弹性下降。
  - id: debt_yoy
    name: 云厂商有息负债同比
    series: hyperscaler_debt
    transform: pct_change
    days: 365
    direction: above
    alert: 0.25
    trigger: 0.50
    unit: pct
    why: 从现金流投资转向借债投资，是周期后段的典型特征（参考 1999–2001 年电信业）。
  - id: nvda_rev_yoy
    name: NVDA 单季收入同比
    series: nvda_revenue_q
    transform: pct_change
    days: 365
    direction: below
    alert: 0.30
    trigger: 0.10
    unit: pct
    tolerance_days: 25
    why: 英伟达是 AI 资本开支的最终收款方，收入增速是整个链条需求的最直接读数。
  - id: nvda_drawdown
    name: NVDA 距 52 周高点回撤
    series: nvda_price
    transform: drawdown
    days: 365
    direction: below
    alert: -0.20
    trigger: -0.35
    unit: pct
    why: 龙头深度回撤会通过指数权重和财富效应传导到整个 AI 板块。
  - id: smh_rel_3m
    name: 半导体相对标普500，3 个月变化
    series: smh_spy_ratio
    transform: pct_change
    days: 91
    direction: below
    alert: -0.10
    trigger: -0.20
    unit: pct
    why: AI 主线跑输大盘，说明资金在撤离领涨板块。
  - id: hy_widening
    name: 高收益债利差，3 个月变化
    series: hy_spread
    transform: diff
    days: 91
    direction: above
    alert: 0.75
    trigger: 1.50
    unit: pp
    why: 信用市场通常先于股市定价风险；利差急升会抬高数据中心项目和 AI 新贵的融资成本。
  - id: vix_level
    name: VIX 波动率
    series: vix
    transform: level
    direction: above
    alert: 25
    trigger: 35
    unit: num
    why: 恐慌升温时，高估值、高集中度的板块最先被抛售。
  - id: real_yield_3m
    name: 10 年期实际利率，3 个月变化
    series: real_yield_10y
    transform: diff
    days: 91
    direction: above
    alert: 0.40
    trigger: 0.75
    unit: pp
    why: AI 股票的价值主要来自远期现金流，对贴现率最敏感。
  - id: bubble_search
    name: Google 搜索 "AI bubble" 热度
    series: trends_ai_bubble
    transform: level
    direction: above
    alert: 50
    trigger: 80
    unit: num
    why: 泡沫担忧进入大众视野时，边际买家会变少；热度是 0–100 的相对值。
  - id: gpu_price_3m
    name: H100 租赁价，3 个月变化
    series: gpu_h100_rental
    transform: pct_change
    days: 91
    direction: below
    alert: -0.15
    trigger: -0.30
    unit: pct
    why: 算力租金下跌意味着供给过剩，GPU 资产的回报率和抵押价值都会下降。
